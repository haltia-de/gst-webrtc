# The release (ADR 0002 in haltia-de/haltia): a vX.Y.Z tag (the GStreamer
# version) builds the signed armv7 packages and puts them into the GitHub
# release.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  apk:
    uses: haltia-de/ci/.github/workflows/apk.yml@v1
    with:
      arch: armv7
    secrets: inherit
