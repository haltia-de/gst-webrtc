name: Alpine GStreamer version
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: alpine-gstreamer-version
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const {readFileSync} = require('node:fs');
            const {execFileSync} = require('node:child_process');
            const apkbuild = readFileSync('packaging/alpine/APKBUILD', 'utf8');
            const local = apkbuild.match(/^pkgver=([0-9]+(?:\.[0-9]+)+)$/m)?.[1];
            if (!local) throw new Error('Cannot read pkgver from APKBUILD');

            const url = 'https://dl-cdn.alpinelinux.org/alpine/v3.24/community/armv7/APKINDEX.tar.gz';
            const response = await fetch(url, {signal: AbortSignal.timeout(60000)});
            if (!response.ok) throw new Error(`APKINDEX download failed: ${response.status}`);
            const index = execFileSync('tar', ['-xzOf', '-', 'APKINDEX'], {
              input: Buffer.from(await response.arrayBuffer()),
              encoding: 'utf8',
              maxBuffer: 32 * 1024 * 1024,
            });
            const packages = index.split(/\n\n/).filter(record =>
              /^P:gst-plugins-bad$/m.test(record));
            if (packages.length !== 1) throw new Error('Expected one gst-plugins-bad package');
            const alpine = packages[0].match(/^V:([0-9]+(?:\.[0-9]+)+)-r[0-9]+$/m)?.[1];
            if (!alpine) throw new Error('Cannot read gst-plugins-bad version');
            core.info(`Alpine: ${alpine}; APKBUILD: ${local}`);
            if (alpine === local) return;

            const marker = '<!-- alpine-gst-plugins-bad-version -->';
            const title = `Alpine has gst-plugins-bad ${alpine}: rebuild haltia-gst-webrtc`;
            const body = [
              marker,
              `В Alpine 3.24 (community, armv7) gst-plugins-bad обновлён до ${alpine}.`,
              `В packaging/alpine/APKBUILD указан pkgver=${local}.`,
              '',
              'Нужно пересобрать haltia-gst-webrtc с версией Alpine и после выпуска обновить linux-port/apps/packages.lock в device-lenovo-b8000h.',
              '',
              `Источник: ${url}`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request &&
              issue.body?.includes(marker));
            if (existing) {
              if (existing.title !== title || existing.body !== body) {
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, title, body,
                });
              }
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }
